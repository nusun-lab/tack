# Example inference lane config
agent.framework.default-lane=${AGENT_FRAMEWORK_DEFAULT_LANE:low-pass}
llm.inference-lane.low.request-topic=${LLM_LOW_REQUEST_TOPIC:llm.requests.low}
llm.inference-lane.low.reply-topic=${LLM_LOW_REPLY_TOPIC:llm.replies.low}
llm.inference-lane.low.endpoint=${LLM_LOW_ENDPOINT:}
llm.inference-lane.low.model=${LLM_LOW_MODEL:}
llm.inference-lane.low.parallelism=${LLM_LOW_PARALLELISM:1}
llm.inference-lane.low.partition-key-strategy=${LLM_LOW_PARTITION_KEY_STRATEGY:AGENT_RUN}
llm.inference-lane.low.api-key=${LLM_LOW_API_KEY:}
llm.inference-lane.low.reasoning-effort=${LLM_LOW_REASONING_EFFORT:${LLM_MODEL_DEFAULT_OPENAI_REASONING_EFFORT:}}
llm.inference-lane.low.temperature=${LLM_LOW_TEMPERATURE:${LLM_MODEL_DEFAULT_OPENAI_TEMPERATURE:0}}
llm.inference-lane.low.top-p=${LLM_LOW_TOP_P:${LLM_MODEL_DEFAULT_OPENAI_TOP_P:1.0}}
llm.inference-lane.low.presence-penalty=${LLM_LOW_PRESENCE_PENALTY:${LLM_MODEL_DEFAULT_OPENAI_PRESENCE_PENALTY:0.0}}
llm.inference-lane.low.top-k=${LLM_LOW_TOP_K:${LLM_MODEL_DEFAULT_OPENAI_TOP_K:-1}}
llm.inference-lane.low.min-p=${LLM_LOW_MIN_P:${LLM_MODEL_DEFAULT_OPENAI_MIN_P:0.0}}
llm.inference-lane.low.repetition-penalty=${LLM_LOW_REPETITION_PENALTY:${LLM_MODEL_DEFAULT_OPENAI_REPETITION_PENALTY:1.0}}
llm.inference-lane.low.context-window=${LLM_LOW_CONTEXT_WINDOW:${LLM_MODEL_DEFAULT_OPENAI_CONTEXT_WINDOW:69632}}
llm.inference-lane.low.max-tokens=${LLM_LOW_MAX_TOKENS:${LLM_MODEL_DEFAULT_OPENAI_MAX_TOKENS:4092}}
llm.inference-lane.low.tool-memory.max-tokens=${LLM_LOW_TOOL_MEMORY_MAX_TOKENS:${LLM_MODEL_DEFAULT_TOOL_MEMORY_MAX_TOKENS:50000}}
llm.inference-lane.low.tool-memory.compaction-threshold=${LLM_LOW_TOOL_MEMORY_COMPACTION_THRESHOLD:${LLM_MODEL_DEFAULT_TOOL_MEMORY_COMPACTION_THRESHOLD:0.50}}
llm.inference-lane.low.tool-memory.recent-tool-interactions=${LLM_LOW_TOOL_MEMORY_RECENT_TOOL_INTERACTIONS:${LLM_MODEL_DEFAULT_TOOL_MEMORY_RECENT_TOOL_INTERACTIONS:3}}
llm.inference-lane.low.max-tool-calling-round-trips=${LLM_LOW_MAX_TOOL_CALLING_ROUND_TRIPS:${LLM_MODEL_DEFAULT_MAX_TOOL_CALLING_ROUND_TRIPS:50}}
llm.inference-lane.high.request-topic=${LLM_HIGH_REQUEST_TOPIC:llm.requests.high}
llm.inference-lane.high.reply-topic=${LLM_HIGH_REPLY_TOPIC:llm.replies.high}
llm.inference-lane.high.endpoint=${LLM_HIGH_ENDPOINT:}
llm.inference-lane.high.model=${LLM_HIGH_MODEL:}
llm.inference-lane.high.parallelism=${LLM_HIGH_PARALLELISM:1}
llm.inference-lane.high.partition-key-strategy=${LLM_HIGH_PARTITION_KEY_STRATEGY:JOB}
llm.inference-lane.high.api-key=${LLM_HIGH_API_KEY:}
llm.inference-lane.high.reasoning-effort=${LLM_HIGH_REASONING_EFFORT:${LLM_MODEL_DEFAULT_OPENAI_REASONING_EFFORT:}}
# Qwen3.8 instruct/non-thinking sampling recommendations.
llm.inference-lane.high.temperature=${LLM_HIGH_TEMPERATURE:0.7}
llm.inference-lane.high.top-p=${LLM_HIGH_TOP_P:0.8}
llm.inference-lane.high.presence-penalty=${LLM_HIGH_PRESENCE_PENALTY:1.5}
llm.inference-lane.high.top-k=${LLM_HIGH_TOP_K:20}
llm.inference-lane.high.min-p=${LLM_HIGH_MIN_P:0.0}
llm.inference-lane.high.repetition-penalty=${LLM_HIGH_REPETITION_PENALTY:1.0}
llm.inference-lane.high.context-window=${LLM_HIGH_CONTEXT_WINDOW:${LLM_MODEL_DEFAULT_OPENAI_CONTEXT_WINDOW:69632}}
llm.inference-lane.high.max-tokens=${LLM_HIGH_MAX_TOKENS:${LLM_MODEL_DEFAULT_OPENAI_MAX_TOKENS:4092}}
llm.inference-lane.high.tool-memory.max-tokens=${LLM_HIGH_TOOL_MEMORY_MAX_TOKENS:${LLM_MODEL_DEFAULT_TOOL_MEMORY_MAX_TOKENS:50000}}
llm.inference-lane.high.tool-memory.compaction-threshold=${LLM_HIGH_TOOL_MEMORY_COMPACTION_THRESHOLD:${LLM_MODEL_DEFAULT_TOOL_MEMORY_COMPACTION_THRESHOLD:0.50}}
llm.inference-lane.high.tool-memory.recent-tool-interactions=${LLM_HIGH_TOOL_MEMORY_RECENT_TOOL_INTERACTIONS:${LLM_MODEL_DEFAULT_TOOL_MEMORY_RECENT_TOOL_INTERACTIONS:3}}
llm.inference-lane.high.max-tool-calling-round-trips=${LLM_HIGH_MAX_TOOL_CALLING_ROUND_TRIPS:${LLM_MODEL_DEFAULT_MAX_TOOL_CALLING_ROUND_TRIPS:50}}

