<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LLM Share Workspace View</title>
  <style>
    :root { color-scheme: dark; }
    body { font-family: system-ui, sans-serif; margin: 24px; background: #0d1117; color: #e6edf3; }
    h1, h2, h3 { margin: 0 0 12px; }
    .muted { color: #8b949e; margin-bottom: 20px; }
    a, summary { color: #58a6ff; }
    .workspace-grid { display: grid; gap: 16px; grid-template-columns: 1.8fr 2.8fr 2.8fr 2fr; align-items: start; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 16px; box-shadow: 0 0 0 1px rgba(240,246,252,0.02) inset; }
    .summary-card { margin-bottom: 20px; }
    .summary-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); margin-bottom: 16px; }
    .summary-item { background: #0d1117; border: 1px solid #30363d; border-radius: 10px; padding: 12px; }
    .summary-label { color: #8b949e; font-size: 12px; }
    .summary-value { font-size: 24px; font-weight: 700; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #30363d; vertical-align: top; }
    code, pre { font-family: ui-monospace, monospace; }
    pre { white-space: pre-wrap; margin: 8px 0 0; }
    .list { display: grid; gap: 12px; }
    .entry { background: #0d1117; border: 1px solid #30363d; border-radius: 10px; padding: 12px; }
    .entry-head { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
    .entry-subhead { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
    .meta { color: #8b949e; font-size: 12px; }
    .preview { color: #c9d1d9; }
    .content-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
    details { border-top: 1px solid #30363d; margin-top: 8px; padding-top: 8px; }
    summary { cursor: pointer; }
    button { background: #1f6feb; color: white; border: 0; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
    button:hover { background: #388bfd; }
    .error { color: #fca5a5; }
    .section-projects { order: 1; }
    .section-team { order: 2; }
    .section-scratchpads { order: 3; }
    .section-ops { order: 4; }
    .role-pill { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; color: #f0f6fc; border: 1px solid transparent; }
    .agent-title { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; }
    .agent-state { font-size: 14px; }
    .routes-block { margin-top: 16px; }
    @media (max-width: 1400px) {
      .workspace-grid { grid-template-columns: 1.5fr 2.2fr 2.2fr 1.8fr; }
    }
    @media (max-width: 1100px) {
      .workspace-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <h1>Workspace View</h1>
  <div class="muted">Read-only view into live agent state. Auto-refreshes every 2s.</div>

  <section class="card summary-card">
    <h2>Summary</h2>
    <div id="summary" class="summary-grid"></div>
  </section>

  <div class="workspace-grid">
    <section class="card section-projects">
      <h2>Project Basics</h2>
      <div id="projects" class="list"></div>
    </section>

    <section class="card section-team">
      <h2>Team Registry</h2>
      <div id="teamRegistry" class="list"></div>
    </section>

    <section class="card section-scratchpads">
      <h2>Agent Scratchpads</h2>
      <div id="scratchpads" class="list"></div>
    </section>

    <section class="card section-ops">
      <h2>Topics &amp; Routes</h2>
      <div id="topicDetails" class="list"></div>
      <div class="routes-block">
        <h3>Routes</h3>
        <table id="routes"></table>
      </div>
    </section>
  </div>

  <script>
    const expandedState = new Set();

    function clear(el) {
      while (el.firstChild) el.removeChild(el.firstChild);
    }

    function text(tag, value, className) {
      const el = document.createElement(tag);
      if (className) el.className = className;
      el.textContent = value ?? '';
      return el;
    }

    function button(label, onClick) {
      const el = document.createElement('button');
      el.type = 'button';
      el.textContent = label;
      el.addEventListener('click', onClick);
      return el;
    }

    function clipText(value, maxChars = 200) {
      const normalized = (value || '').replace(/\s+/g, ' ').trim();
      if (normalized.length <= maxChars) return normalized;
      return normalized.slice(0, maxChars - 1).trimEnd() + '…';
    }

    function formatTimestamp(value) {
      if (!value) return '';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      return date.toLocaleString();
    }

    function parseAnsiColor(value) {
      const match = /^38;2;(\d+);(\d+);(\d+)$/.exec(value || '');
      if (!match) return { bg: '#30363d', border: '#484f58' };
      const [, r, g, b] = match;
      return {
        bg: `rgba(${r}, ${g}, ${b}, 0.28)`,
        border: `rgb(${r}, ${g}, ${b})`
      };
    }

    function activityIcon(entry) {
      if ((entry.routeStatus || '').toUpperCase() !== 'STARTED') return '⏳';
      return entry.activeNow ? '☀️' : '🌙';
    }

    async function copyText(value) {
      try {
        await navigator.clipboard.writeText(value ?? '');
      } catch (_) {
      }
    }

    function renderTable(el, headers, rows) {
      clear(el);
      const thead = document.createElement('thead');
      const trh = document.createElement('tr');
      headers.forEach(h => trh.appendChild(text('th', h)));
      thead.appendChild(trh);
      el.appendChild(thead);

      const tbody = document.createElement('tbody');
      if (!rows.length) {
        const tr = document.createElement('tr');
        const td = document.createElement('td');
        td.colSpan = headers.length;
        td.textContent = 'No data';
        tr.appendChild(td);
        tbody.appendChild(tr);
      } else {
        rows.forEach(row => {
          const tr = document.createElement('tr');
          row.forEach(cell => {
            const td = document.createElement('td');
            if (cell instanceof Node) td.appendChild(cell);
            else td.textContent = cell ?? '';
            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        });
      }
      el.appendChild(tbody);
    }

    function renderSummary(el, summary) {
      clear(el);
      const items = [
        ['Routes', summary?.routes],
        ['Started Routes', summary?.startedRoutes],
        ['Topics', summary?.topics],
        ['Topic Messages', summary?.totalTopicMessages],
        ['Personas', summary?.personas],
        ['Active Personas', summary?.activePersonas],
        ['Projects', summary?.projects],
        ['Scratchpads', summary?.scratchpads]
      ];
      items.forEach(([label, value]) => {
        const card = text('div', '', 'summary-item');
        card.appendChild(text('div', label, 'summary-label'));
        card.appendChild(text('div', String(value ?? 0), 'summary-value'));
        el.appendChild(card);
      });
    }

    function rememberDetailsState(details, stateKey) {
      details.open = expandedState.has(stateKey);
      details.addEventListener('toggle', () => {
        if (details.open) expandedState.add(stateKey);
        else expandedState.delete(stateKey);
      });
    }

    function renderExpandableList(el, entries, sectionKey, labelKey, fullTextKey, stateKeyFn, options = {}) {
      const previewChars = options.previewChars || 200;
      clear(el);
      if (!entries.length) {
        el.appendChild(text('div', 'No data', 'meta'));
        return;
      }
      entries.forEach(entry => {
        const card = text('div', '', 'entry');
        const head = text('div', '', 'entry-head');
        head.appendChild(text('code', entry.requestId || ''));
        const labelValue = labelKey ? entry[labelKey] : '';
        if (labelValue && (options.showDuplicateLabel || labelValue !== entry.requestId)) {
          head.appendChild(text('code', labelValue));
        }
        card.appendChild(head);
        if (entry.goal) {
          card.appendChild(text('div', `Goal: ${entry.goal}`, 'meta'));
        }
        const stateKey = stateKeyFn ? stateKeyFn(entry) : `${sectionKey}:${entry.requestId || ''}:${entry[labelKey] || ''}`;
        const content = text('pre', '', 'preview');
        const fullText = entry[fullTextKey] || '';
        const previewText = clipText(fullText, previewChars);
        const canExpand = fullText !== previewText;
        const renderContent = () => {
          content.textContent = expandedState.has(stateKey) ? fullText : previewText;
        };
        renderContent();
        card.appendChild(content);
        const contentMeta = text('div', '', 'content-meta');
        contentMeta.appendChild(text('span', `len ${entry.length ?? 0}`, 'meta'));
        contentMeta.appendChild(button('Copy', () => copyText(fullText)));
        if (canExpand) {
          const toggle = button(expandedState.has(stateKey) ? 'Show less' : 'Show full text', () => {
            if (expandedState.has(stateKey)) expandedState.delete(stateKey);
            else expandedState.add(stateKey);
            toggle.textContent = expandedState.has(stateKey) ? 'Show less' : 'Show full text';
            renderContent();
          });
          contentMeta.appendChild(toggle);
        }
        card.appendChild(contentMeta);
        el.appendChild(card);
      });
    }

    function renderTopicDetails(el, topicDetails) {
      clear(el);
      if (!topicDetails.length) {
        el.appendChild(text('div', 'No topics', 'meta'));
        return;
      }
      topicDetails.forEach(topic => {
        const card = text('div', '', 'entry');
        const head = text('div', '', 'entry-head');
        head.appendChild(text('code', topic.name || ''));
        head.appendChild(text('span', `partitions ${topic.partitions ?? '?'}`, 'meta'));
        head.appendChild(text('span', `messages ${topic.messageCount ?? '?'}`, 'meta'));
        card.appendChild(head);
        if (topic.error) {
          card.appendChild(text('div', `Error: ${topic.error}`, 'error'));
        }
        const details = document.createElement('details');
        rememberDetailsState(details, `topic:${topic.name || ''}`);
        details.appendChild(text('summary', 'Show offsets'));
        const pre = document.createElement('pre');
        pre.textContent = JSON.stringify(topic.offsets || [], null, 2);
        details.appendChild(pre);
        card.appendChild(details);
        el.appendChild(card);
      });
    }

    function renderTeamRegistry(el, entries) {
      clear(el);
      if (!entries.length) {
        el.appendChild(text('div', 'No personas', 'meta'));
        return;
      }
      entries.forEach(entry => {
        const card = text('div', '', 'entry');
        const head = text('div', '', 'entry-head');
        const title = text('div', '', 'agent-title');
        title.appendChild(text('span', activityIcon(entry), 'agent-state'));
        title.appendChild(text('strong', entry.displayName || ''));
        head.appendChild(title);
        const rolePill = text('span', entry.roleId || '', 'role-pill');
        const color = parseAnsiColor(entry.ansiColor);
        rolePill.style.background = color.bg;
        rolePill.style.borderColor = color.border;
        head.appendChild(rolePill);
        card.appendChild(head);
        const subhead = text('div', '', 'entry-subhead');
        subhead.appendChild(text('span', entry.loopStatus || 'Idle', 'meta'));
        subhead.appendChild(text('span', entry.routeStatus || 'UNKNOWN', 'meta'));
        subhead.appendChild(text('span', `messages ${entry.messageCount ?? 0}`, 'meta'));
        if (entry.lastActivity) subhead.appendChild(text('span', `last ${formatTimestamp(entry.lastActivity)}`, 'meta'));
        card.appendChild(subhead);
        card.appendChild(text('div', entry.capabilitySummary || '', 'preview'));

        const activity = text('div', '', 'meta');
        const activityParts = [];
        if (entry.lastActivity) activityParts.push(`last ${formatTimestamp(entry.lastActivity)}`);
        activity.textContent = activityParts.length ? activityParts.join(' | ') : 'No recent activity';
        card.appendChild(activity);

        const identities = text('div', '', 'meta');
        const identityMap = entry.platformIdentities || {};
        const identityValues = Object.entries(identityMap).map(([key, value]) => `${key}: ${value}`);
        identities.textContent = identityValues.length ? identityValues.join(' | ') : 'No platform identities';
        card.appendChild(identities);

        const routineDetails = document.createElement('details');
        rememberDetailsState(routineDetails, `persona-activity:${entry.roleId || ''}`);
        routineDetails.appendChild(text('summary', 'Show current routine context'));
        routineDetails.appendChild(text('pre', entry.currentRoutine || 'No current routine'));
        card.appendChild(routineDetails);
        el.appendChild(card);
      });
    }

    async function refresh() {
      const res = await fetch('/workspace/view');
      const data = await res.json();

      renderSummary(document.getElementById('summary'), data.summary || {});

      renderTable(
        document.getElementById('routes'),
        ['Route', 'Status'],
        (data.routes || []).map(r => [r.routeId, r.status])
      );

      renderTeamRegistry(document.getElementById('teamRegistry'), data.teamRegistry || []);
      renderTopicDetails(document.getElementById('topicDetails'), data.topicDetails || []);
      renderExpandableList(
        document.getElementById('projects'),
        data.projects || [],
        'projects',
        'requestId',
        'fullText',
        entry => `project:${entry.requestId || ''}`
      );
      renderExpandableList(
        document.getElementById('scratchpads'),
        data.scratchpads || [],
        'scratchpads',
        'roleId',
        'fullText',
        entry => `scratchpad:${entry.requestId || ''}:${entry.roleId || ''}`,
        { previewChars: 200 }
      );
    }

    refresh();
    setInterval(refresh, 2000);
  </script>
</body>
</html>
