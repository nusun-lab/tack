quarkus.application.name=llm-share-camel-kafka
quarkus.http.port=8080
quarkus.swagger-ui.always-include=true
quarkus.log.console.format=%m%n
quarkus.log.category."org.apache.kafka.clients.consumer.internals".level=OFF
quarkus.log.category."org.apache.camel.component.kafka.KafkaFetchRecords".level=OFF

# Kafka is externally managed for both development and deployment.
quarkus.kafka.devservices.enabled=false
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
camel.component.kafka.brokers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
llm.topic.requests=${LLM_TOPIC_REQUESTS:llm.requests}
llm.topic.responses=${LLM_TOPIC_RESPONSES:llm.responses}
llm.topic.dead-letter=${LLM_TOPIC_DEAD_LETTER:llm.dead-letter}
llm.consumer.group=${LLM_CONSUMER_GROUP:llm-share-workers}
llm.response.consumer.group=${LLM_RESPONSE_CONSUMER_GROUP:llm-share-response-log-${quarkus.uuid}}
llm.kafka.provision-topics=${LLM_KAFKA_PROVISION_TOPICS:true}
llm.kafka.topic-partitions=${LLM_KAFKA_TOPIC_PARTITIONS:1}
llm.kafka.topic-replication-factor=${LLM_KAFKA_TOPIC_REPLICATION_FACTOR:1}
camel.component.kafka.shutdown-timeout=1

# Scarce-resource control. Keep this at 1 while the shared model can handle one active request.
llm.worker.enabled=${LLM_WORKER_ENABLED:true}
llm.worker.consumers-count=${LLM_WORKER_CONSUMERS_COUNT:1}
llm.worker.max-poll-records=${LLM_WORKER_MAX_POLL_RECORDS:1}
llm.reply-timeout-ms=${LLM_REPLY_TIMEOUT_MS:300000}
llm.mock.enabled=${LLM_MOCK_ENABLED:false}
llm.log.ansi-enabled=${LLM_LOG_ANSI_ENABLED:true}

# LangChain4j OpenAI-compatible model. The base URL includes the API version root.
# LLM_OPENAI_* can override the standard OPENAI_* variables when needed.
llm.openai.base-url=${LLM_OPENAI_BASE_URL:${OPENAI_BASE_URL:http://localhost:8000/v1}}
llm.openai.api-key=${LLM_OPENAI_API_KEY:${OPENAI_API_KEY:not-needed}}
llm.openai.model=${LLM_OPENAI_MODEL:${OPENAI_MODEL:qwen-36-27b}}
llm.openai.temperature=${LLM_OPENAI_TEMPERATURE:0}
llm.openai.max-tokens=${LLM_OPENAI_MAX_TOKENS:4096}
llm.openai.timeout-ms=${LLM_OPENAI_TIMEOUT_MS:300000}
llm.openai.strict-json-schema=${LLM_OPENAI_STRICT_JSON_SCHEMA:true}
llm.structured-output.provider-schema-enabled=${LLM_STRUCTURED_OUTPUT_PROVIDER_SCHEMA_ENABLED:false}
llm.thinking-off.enabled=${LLM_THINKING_OFF_ENABLED:true}

# Prompt-only software team identities. MCP clients can later be attached to these same roles.
agents.software-team.sleep-ms=${AGENTS_SOFTWARE_TEAM_SLEEP_MS:1000}
agents.software-team.max-days=${AGENTS_SOFTWARE_TEAM_MAX_DAYS:2}
agents.software-team.max-cycles=${AGENTS_SOFTWARE_TEAM_MAX_CYCLES:6}
agents.software-team.director.system-prompt=You are the director of a small software team. Break the user's request into role-specific missions for the available team roles. Each mission should clearly define the role's intended outcome and constraints. Stay grounded in the user's requested product and goals. Return valid JSON only when asked for structured output. Do not include markdown fences, comments, prefixes, or explanatory text.
agents.software-team.project-manager.system-prompt=You are the Project Manager in a small software team. Coordinate the work, sequencing, risks, and handoffs for the user's requested product. Keep responses concise. Return valid JSON only when asked for structured output. Do not include markdown fences, comments, prefixes, or explanatory text.
agents.software-team.product-owner.system-prompt=You are the Product Owner in a small software team. Clarify scope, backlog priorities, and acceptance criteria for the user's requested product. Keep responses concise. Return valid JSON only when asked for structured output. Do not include markdown fences, comments, prefixes, or explanatory text.
agents.software-team.application-developer.system-prompt=You are the Application Developer in a small software team. Focus on implementation, delivery risks, and handoff details for the user's requested product. Keep responses concise. Return valid JSON only when asked for structured output. Do not include markdown fences, comments, prefixes, or explanatory text.

camel.main.source-location-enabled=true
camel.main.name=llm-share-camel-kafka
camel.main.shutdown-timeout=1
camel.main.shutdown-now-on-timeout=true
camel.dataformat.jackson.auto-discover-object-mapper=true
