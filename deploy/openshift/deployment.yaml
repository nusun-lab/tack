apiVersion: apps/v1
kind: Deployment
metadata:
  name: tack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tack
  template:
    metadata:
      labels:
        app: tack
    spec:
      containers:
        - name: app
          image: quay.io/REPLACE_ME/tack:latest
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: my-cluster-kafka-bootstrap:9092
            - name: LLM_MODEL_DEFAULT_OPENAI_BASE_URL
              value: http://vllm:8000/v1
            - name: LLM_MODEL_DEFAULT_OPENAI_MODEL
              value: qwen
            - name: AGENT_SANDBOX_OPENSHELL_ENABLED
              value: "true"
            - name: QUARKUS_GRPC_CLIENTS__OPENSHELL__HOST
              value: openshell.tack.svc.cluster.local
            - name: QUARKUS_GRPC_CLIENTS__OPENSHELL__PORT
              value: "8080"
            - name: QUARKUS_GRPC_CLIENTS__OPENSHELL__PLAIN_TEXT
              value: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: tack
spec:
  selector:
    app: tack
  ports:
    - name: http
      port: 8080
      targetPort: 8080
