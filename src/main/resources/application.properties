# Core framework configuration
quarkus.application.name=tack
quarkus.http.port=8080
quarkus.swagger-ui.always-include=true
quarkus.log.console.format=%m%n
quarkus.log.category."org.apache.kafka.clients.consumer.internals".level=OFF
quarkus.log.category."org.apache.camel.component.kafka.KafkaFetchRecords".level=OFF
quarkus.log.category."us.nusun.tack.framework.mcp".level=INFO

quarkus.kafka.devservices.enabled=false
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
camel.component.kafka.brokers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
camel.component.kafka.shutdown-timeout=1

llm.topic.dead-letter=${LLM_TOPIC_DEAD_LETTER:llm.dead-letter}
llm.consumer.group=${LLM_CONSUMER_GROUP:tack-workers}
llm.response.consumer.group=${LLM_RESPONSE_CONSUMER_GROUP:tack-response-log-${quarkus.uuid}}
llm.kafka.provision-topics=${LLM_KAFKA_PROVISION_TOPICS:true}
llm.kafka.topic-partitions=${LLM_KAFKA_TOPIC_PARTITIONS:1}
llm.kafka.topic-replication-factor=${LLM_KAFKA_TOPIC_REPLICATION_FACTOR:1}
llm.worker.enabled=${LLM_WORKER_ENABLED:true}
llm.local-worker-route-verification.enabled=${LLM_LOCAL_WORKER_ROUTE_VERIFICATION_ENABLED:true}
llm.reply-timeout-ms=${LLM_REPLY_TIMEOUT_MS:900000}
llm.log.ansi-enabled=${LLM_LOG_ANSI_ENABLED:true}
agent-run.scheduled.topic=${AGENT_RUN_SCHEDULED_TOPIC:agent-runs.scheduled}
agent-run.scheduled.consumer.group=${AGENT_RUN_SCHEDULED_CONSUMER_GROUP:agent-run-scheduler}
agent-run.scheduled.consumer.enabled=${AGENT_RUN_SCHEDULED_CONSUMER_ENABLED:true}

# Persona-scoped OpenShell execution. Disabled by default so local/unit runs do not require a gateway.
agent.sandbox.openshell.enabled=${AGENT_SANDBOX_OPENSHELL_ENABLED:false}
agent.sandbox.openshell.executable=${OPENSHELL_EXECUTABLE:openshell}
agent.sandbox.openshell.gateway-endpoint=${OPENSHELL_GATEWAY_ENDPOINT:http://openshell.tack.svc.cluster.local:8080}
agent.sandbox.openshell.control-timeout-seconds=${OPENSHELL_CONTROL_TIMEOUT_SECONDS:180}
agent.sandbox.openshell.provision-timeout-seconds=${OPENSHELL_PROVISION_TIMEOUT_SECONDS:900}
agent.sandbox.openshell.exec-timeout-seconds=${OPENSHELL_EXEC_TIMEOUT_SECONDS:120}
agent.sandbox.openshell.image=${OPENSHELL_SANDBOX_IMAGE:quay.io/devfile/universal-developer-image:ubi9-latest}
# Optional fallback when an AgentRun does not provide a repository-derived Gitea endpoint.
agent.sandbox.gitea.url=${GITEA_URL:}

# Framework defaults for inference lanes. Lanes can override endpoint/model/API key and sampling.
llm.model-default.openai.base-url=${LLM_MODEL_DEFAULT_OPENAI_BASE_URL:http://localhost:8000/v1}
llm.model-default.openai.api-key=${LLM_MODEL_DEFAULT_OPENAI_API_KEY:not-needed}
llm.model-default.openai.model=${LLM_MODEL_DEFAULT_OPENAI_MODEL:qwen-36-27b}
llm.model-default.openai.temperature=${LLM_MODEL_DEFAULT_OPENAI_TEMPERATURE:0}
llm.model-default.openai.top-p=${LLM_MODEL_DEFAULT_OPENAI_TOP_P:1.0}
llm.model-default.openai.presence-penalty=${LLM_MODEL_DEFAULT_OPENAI_PRESENCE_PENALTY:0.0}
llm.model-default.openai.top-k=${LLM_MODEL_DEFAULT_OPENAI_TOP_K:-1}
llm.model-default.openai.min-p=${LLM_MODEL_DEFAULT_OPENAI_MIN_P:0.0}
llm.model-default.openai.repetition-penalty=${LLM_MODEL_DEFAULT_OPENAI_REPETITION_PENALTY:1.0}
llm.model-default.openai.max-tokens=${LLM_MODEL_DEFAULT_OPENAI_MAX_TOKENS:4092}
llm.model-default.openai.context-window=${LLM_MODEL_DEFAULT_OPENAI_CONTEXT_WINDOW:69632}
llm.model-default.openai.timeout-ms=${LLM_MODEL_DEFAULT_OPENAI_TIMEOUT_MS:300000}
llm.model-default.openai.strict-json-schema=${LLM_MODEL_DEFAULT_OPENAI_STRICT_JSON_SCHEMA:true}
llm.model-default.openai.thinking-off.enabled=${LLM_MODEL_DEFAULT_OPENAI_THINKING_OFF_ENABLED:true}
llm.model-default.openai.reasoning-effort=${LLM_MODEL_DEFAULT_OPENAI_REASONING_EFFORT:}
llm.model-default.structured-output.provider-schema-enabled=${LLM_MODEL_DEFAULT_STRUCTURED_OUTPUT_PROVIDER_SCHEMA_ENABLED:false}
llm.model-default.tool-memory.max-tokens=${LLM_MODEL_DEFAULT_TOOL_MEMORY_MAX_TOKENS:50000}
llm.model-default.tool-memory.compaction-threshold=${LLM_MODEL_DEFAULT_TOOL_MEMORY_COMPACTION_THRESHOLD:0.50}
llm.model-default.tool-memory.recent-tool-interactions=${LLM_MODEL_DEFAULT_TOOL_MEMORY_RECENT_TOOL_INTERACTIONS:3}
llm.model-default.max-tool-calling-round-trips=${LLM_MODEL_DEFAULT_MAX_TOOL_CALLING_ROUND_TRIPS:50}

agent.mcp.logging.transport-requests=${AGENT_MCP_LOG_TRANSPORT_REQUESTS:false}
agent.mcp.logging.transport-responses=${AGENT_MCP_LOG_TRANSPORT_RESPONSES:false}
agent.mcp.transport-timeout-ms=${AGENT_MCP_TRANSPORT_TIMEOUT_MS:60000}
agent.mcp.initialization-timeout-ms=${AGENT_MCP_INITIALIZATION_TIMEOUT_MS:30000}
agent.mcp.max-tool-result-tokens=${AGENT_MCP_MAX_TOOL_RESULT_TOKENS:1000}

camel.main.source-location-enabled=true
camel.main.name=tack
camel.main.shutdown-timeout=1
camel.main.shutdown-now-on-timeout=true
camel.dataformat.jackson.auto-discover-object-mapper=true

