# Core framework configuration
quarkus.application.name=llm-share-camel-kafka
quarkus.http.port=8080
quarkus.swagger-ui.always-include=true
quarkus.log.console.format=%m%n
quarkus.log.category."org.apache.kafka.clients.consumer.internals".level=OFF
quarkus.log.category."org.apache.camel.component.kafka.KafkaFetchRecords".level=OFF
quarkus.log.category."us.nusun.llmshare.mcp".level=INFO

quarkus.kafka.devservices.enabled=false
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
camel.component.kafka.brokers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
camel.component.kafka.shutdown-timeout=1

llm.topic.dead-letter=${LLM_TOPIC_DEAD_LETTER:llm.dead-letter}
llm.consumer.group=${LLM_CONSUMER_GROUP:llm-share-workers}
llm.response.consumer.group=${LLM_RESPONSE_CONSUMER_GROUP:llm-share-response-log-${quarkus.uuid}}
llm.kafka.provision-topics=${LLM_KAFKA_PROVISION_TOPICS:true}
llm.kafka.topic-partitions=${LLM_KAFKA_TOPIC_PARTITIONS:1}
llm.kafka.topic-replication-factor=${LLM_KAFKA_TOPIC_REPLICATION_FACTOR:1}
llm.worker.enabled=${LLM_WORKER_ENABLED:true}
llm.local-worker-route-verification.enabled=${LLM_LOCAL_WORKER_ROUTE_VERIFICATION_ENABLED:true}
llm.reply-timeout-ms=${LLM_REPLY_TIMEOUT_MS:900000}
llm.log.ansi-enabled=${LLM_LOG_ANSI_ENABLED:true}
agent-run.scheduled.topic=${AGENT_RUN_SCHEDULED_TOPIC:agent-runs.scheduled}
agent-run.scheduled.consumer.group=${AGENT_RUN_SCHEDULED_CONSUMER_GROUP:agent-run-scheduler}
agent-run.scheduled.consumer.enabled=${AGENT_RUN_SCHEDULED_CONSUMER_ENABLED:true}

# Framework defaults for runtime inventory. Lanes/runtimes can override endpoint/model/API key.
llm.runtime-default.openai.base-url=${LLM_RUNTIME_DEFAULT_OPENAI_BASE_URL:http://localhost:8000/v1}
llm.runtime-default.openai.api-key=${LLM_RUNTIME_DEFAULT_OPENAI_API_KEY:not-needed}
llm.runtime-default.openai.model=${LLM_RUNTIME_DEFAULT_OPENAI_MODEL:qwen-36-27b}
llm.runtime-default.openai.temperature=${LLM_RUNTIME_DEFAULT_OPENAI_TEMPERATURE:0}
llm.runtime-default.openai.max-tokens=${LLM_RUNTIME_DEFAULT_OPENAI_MAX_TOKENS:4096}
llm.runtime-default.openai.timeout-ms=${LLM_RUNTIME_DEFAULT_OPENAI_TIMEOUT_MS:300000}
llm.runtime-default.openai.strict-json-schema=${LLM_RUNTIME_DEFAULT_OPENAI_STRICT_JSON_SCHEMA:true}
llm.runtime-default.openai.thinking-off.enabled=${LLM_RUNTIME_DEFAULT_OPENAI_THINKING_OFF_ENABLED:true}
llm.runtime-default.structured-output.provider-schema-enabled=${LLM_RUNTIME_DEFAULT_STRUCTURED_OUTPUT_PROVIDER_SCHEMA_ENABLED:false}
llm.runtime-default.tool-memory.max-tokens=${LLM_RUNTIME_DEFAULT_TOOL_MEMORY_MAX_TOKENS:12000}

agent.mcp.logging.transport-requests=${AGENT_MCP_LOG_TRANSPORT_REQUESTS:false}
agent.mcp.logging.transport-responses=${AGENT_MCP_LOG_TRANSPORT_RESPONSES:false}
agent.mcp.transport-timeout-ms=${AGENT_MCP_TRANSPORT_TIMEOUT_MS:60000}
agent.mcp.initialization-timeout-ms=${AGENT_MCP_INITIALIZATION_TIMEOUT_MS:30000}
agent.mcp.max-tool-result-characters=${AGENT_MCP_MAX_TOOL_RESULT_CHARACTERS:1000}

camel.main.source-location-enabled=true
camel.main.name=llm-share-camel-kafka
camel.main.shutdown-timeout=1
camel.main.shutdown-now-on-timeout=true
camel.dataformat.jackson.auto-discover-object-mapper=true

# Example software-team inventory configuration follows.
# These properties are consumed by classes under us.nusun.llmshare.example.*.

# Example persona config
persona.noah.identity.mattermost.token=${NOAH_MATTERMOST_TOKEN:}
persona.noah.identity.gitea.token=${NOAH_GITEA_TOKEN:}
persona.noah.identity.plane.token=${NOAH_PLANE_TOKEN:}
persona.owen.identity.mattermost.token=${OWEN_MATTERMOST_TOKEN:}
persona.owen.identity.gitea.token=${OWEN_GITEA_TOKEN:}
persona.owen.identity.plane.token=${OWEN_PLANE_TOKEN:}
persona.ethan.identity.mattermost.token=${ETHAN_MATTERMOST_TOKEN:}
persona.ethan.identity.gitea.token=${ETHAN_GITEA_TOKEN:}
persona.ethan.identity.plane.token=${ETHAN_PLANE_TOKEN:}
persona.miles.identity.mattermost.token=${MILES_MATTERMOST_TOKEN:}
persona.miles.identity.gitea.token=${MILES_GITEA_TOKEN:}
persona.miles.identity.plane.token=${MILES_PLANE_TOKEN:}

# Example runtime config
agent.framework.default-synthesis-runtime=${AGENT_FRAMEWORK_DEFAULT_SYNTHESIS_RUNTIME:synthesis-low}
llm.inference-lane.low.request-topic=${LLM_LOW_REQUEST_TOPIC:llm.requests.low}
llm.inference-lane.low.reply-topic=${LLM_LOW_REPLY_TOPIC:llm.replies.low}
llm.inference-lane.low.endpoint=${LLM_LOW_ENDPOINT:}
llm.inference-lane.low.model=${LLM_LOW_MODEL:}
llm.inference-lane.low.parallelism=${LLM_LOW_PARALLELISM:1}
llm.inference-lane.low.partition-key-strategy=${LLM_LOW_PARTITION_KEY_STRATEGY:AGENT_RUN}
llm.inference-lane.low.api-key=${LLM_LOW_API_KEY:}
llm.inference-lane.high.request-topic=${LLM_HIGH_REQUEST_TOPIC:llm.requests.high}
llm.inference-lane.high.reply-topic=${LLM_HIGH_REPLY_TOPIC:llm.replies.high}
llm.inference-lane.high.endpoint=${LLM_HIGH_ENDPOINT:}
llm.inference-lane.high.model=${LLM_HIGH_MODEL:}
llm.inference-lane.high.parallelism=${LLM_HIGH_PARALLELISM:1}
llm.inference-lane.high.partition-key-strategy=${LLM_HIGH_PARTITION_KEY_STRATEGY:AGENT_RUN}
llm.inference-lane.high.api-key=${LLM_HIGH_API_KEY:}

# Example tool config
agent.tool.mcp.mattermost.url=${MATTERMOST_MCP_URL:}
agent.tool.mcp.mattermost.transport-type=${MATTERMOST_MCP_TRANSPORT_TYPE:streamableHttp}
agent.tool.mcp.mattermost.auth-header-name=${MATTERMOST_AUTH_HEADER_NAME:Authorization}
agent.tool.mcp.mattermost.auth-header-value-format=${MATTERMOST_AUTH_HEADER_VALUE_FORMAT:Bearer %s}
agent.tool.mcp.gitea.url=${GITEA_MCP_URL:}
agent.tool.mcp.gitea.transport-type=${GITEA_MCP_TRANSPORT_TYPE:streamableHttp}
agent.tool.mcp.gitea.auth-header-name=${GITEA_AUTH_HEADER_NAME:Authorization}
agent.tool.mcp.gitea.auth-header-value-format=${GITEA_AUTH_HEADER_VALUE_FORMAT:token %s}
agent.tool.mcp.plane.url=${PLANE_MCP_URL:}
agent.tool.mcp.plane.transport-type=${PLANE_MCP_TRANSPORT_TYPE:streamableHttp}
agent.tool.mcp.plane.auth-header-name=${PLANE_AUTH_HEADER_NAME:Authorization}
agent.tool.mcp.plane.auth-header-value-format=${PLANE_AUTH_HEADER_VALUE_FORMAT:Bearer %s}
agent.tool.mcp.plane.workspace-slug=${PLANE_WORKSPACE_SLUG:}
