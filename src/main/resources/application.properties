agent.tool.profile.workspace-readonly.max-result-tokens=${AGENT_TOOL_PROFILE_WORKSPACE_READONLY_MAX_RESULT_TOKENS:60000}
agent.tool.profile.workspace-coordination.max-result-tokens=${AGENT_TOOL_PROFILE_WORKSPACE_COORDINATION_MAX_RESULT_TOKENS:60000}
agent.tool.mcp.mattermost.url=${MATTERMOST_MCP_URL:}
agent.tool.profile.team-chat.max-result-tokens=${AGENT_TOOL_PROFILE_TEAM_CHAT_MAX_RESULT_TOKENS:60000}
