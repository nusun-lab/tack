apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-share-camel-kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-share-camel-kafka
  template:
    metadata:
      labels:
        app: llm-share-camel-kafka
    spec:
      containers:
        - name: app
          image: quay.io/REPLACE_ME/llm-share-camel-kafka:latest
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: my-cluster-kafka-bootstrap:9092
            - name: LLM_MODEL_DEFAULT_OPENAI_BASE_URL
              value: http://vllm:8000/v1
            - name: LLM_MODEL_DEFAULT_OPENAI_MODEL
              value: qwen
            - name: AGENT_TOOL_PROFILE_WORKSPACE_READONLY_MAX_RESULT_TOKENS
              value: "4000"
            - name: AGENT_TOOL_PROFILE_WORKSPACE_COORDINATION_MAX_RESULT_TOKENS
              value: "5000"
            - name: AGENT_SANDBOX_OPENSHELL_ENABLED
              value: "true"
            - name: OPENSHELL_GATEWAY_ENDPOINT
              value: http://openshell.tack.svc.cluster.local:8080
---
apiVersion: v1
kind: Service
metadata:
  name: llm-share-camel-kafka
spec:
  selector:
    app: llm-share-camel-kafka
  ports:
    - name: http
      port: 8080
      targetPort: 8080
