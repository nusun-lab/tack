quarkus.application.name=llm-share-camel-kafka
quarkus.http.port=8080
quarkus.swagger-ui.always-include=true
quarkus.log.console.format=%m%n
quarkus.log.category."org.apache.kafka.clients.consumer.internals".level=OFF
quarkus.log.category."org.apache.camel.component.kafka.KafkaFetchRecords".level=OFF

quarkus.kafka.devservices.enabled=false
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
camel.component.kafka.brokers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

llm.inference-lane.low.request-topic=${LLM_LOW_REQUEST_TOPIC:llm.requests.low}
llm.inference-lane.low.reply-topic=${LLM_LOW_REPLY_TOPIC:llm.replies.low}
llm.inference-lane.low.endpoint=${LLM_LOW_ENDPOINT:}
llm.inference-lane.low.api-key=${LLM_LOW_API_KEY:}
llm.inference-lane.high.request-topic=${LLM_HIGH_REQUEST_TOPIC:llm.requests.high}
llm.inference-lane.high.reply-topic=${LLM_HIGH_REPLY_TOPIC:llm.replies.high}
llm.inference-lane.high.endpoint=${LLM_HIGH_ENDPOINT:}
llm.inference-lane.high.api-key=${LLM_HIGH_API_KEY:}
llm.topic.dead-letter=${LLM_TOPIC_DEAD_LETTER:llm.dead-letter}
llm.consumer.group=${LLM_CONSUMER_GROUP:llm-share-workers}
llm.response.consumer.group=${LLM_RESPONSE_CONSUMER_GROUP:llm-share-response-log-${quarkus.uuid}}
llm.kafka.provision-topics=${LLM_KAFKA_PROVISION_TOPICS:true}
llm.kafka.topic-partitions=${LLM_KAFKA_TOPIC_PARTITIONS:1}
llm.kafka.topic-replication-factor=${LLM_KAFKA_TOPIC_REPLICATION_FACTOR:1}
camel.component.kafka.shutdown-timeout=1

llm.worker.enabled=${LLM_WORKER_ENABLED:true}
llm.reply-timeout-ms=${LLM_REPLY_TIMEOUT_MS:900000}
llm.log.ansi-enabled=${LLM_LOG_ANSI_ENABLED:true}

llm.openai.base-url=${LLM_OPENAI_BASE_URL:${OPENAI_BASE_URL:http://localhost:8000/v1}}
llm.openai.api-key=${LLM_OPENAI_API_KEY:${OPENAI_API_KEY:not-needed}}
llm.openai.model=${LLM_OPENAI_MODEL:${OPENAI_MODEL:qwen-36-27b}}
llm.openai.temperature=${LLM_OPENAI_TEMPERATURE:0}
llm.openai.max-tokens=${LLM_OPENAI_MAX_TOKENS:4096}
llm.agent.memory.max-tokens=${LLM_AGENT_MEMORY_MAX_TOKENS:12000}
llm.openai.timeout-ms=${LLM_OPENAI_TIMEOUT_MS:300000}
llm.openai.strict-json-schema=${LLM_OPENAI_STRICT_JSON_SCHEMA:true}
llm.structured-output.provider-schema-enabled=${LLM_STRUCTURED_OUTPUT_PROVIDER_SCHEMA_ENABLED:false}
llm.thinking-off.enabled=${LLM_THINKING_OFF_ENABLED:true}

# Application defaults select the example software-team starter run. Swap these to run another namespace.
agent.framework.initial-agent-run.persona-id=${AGENT_FRAMEWORK_INITIAL_AGENT_RUN_PERSONA_ID:software-team/noah}
agent.framework.initial-agent-run.routine-id=${AGENT_FRAMEWORK_INITIAL_AGENT_RUN_ROUTINE_ID:software-team/director}
agent.framework.default-synthesis-runtime=${AGENT_FRAMEWORK_DEFAULT_SYNTHESIS_RUNTIME:synthesis-low}

agent.mcp.logging.transport-requests=${AGENT_MCP_LOG_TRANSPORT_REQUESTS:false}
agent.mcp.logging.transport-responses=${AGENT_MCP_LOG_TRANSPORT_RESPONSES:false}
quarkus.log.category."us.nusun.llmshare.mcp".level=INFO
agent.mcp.mattermost.url=${MATTERMOST_MCP_URL:}
agent.mcp.gitea.url=${GITEA_MCP_URL:}
agent.mcp.plane.url=${PLANE_MCP_URL:}
# Only streamableHttp MCP transport is supported. The transport-type keys remain
# for configuration visibility, but non-streamable values are ignored with a warning.
agent.mcp.mattermost.transport-type=${MATTERMOST_MCP_TRANSPORT_TYPE:streamableHttp}
agent.mcp.gitea.transport-type=${GITEA_MCP_TRANSPORT_TYPE:streamableHttp}
agent.mcp.plane.transport-type=${PLANE_MCP_TRANSPORT_TYPE:streamableHttp}
agent.mcp.mattermost.auth-header-name=${MATTERMOST_AUTH_HEADER_NAME:Authorization}
agent.mcp.gitea.auth-header-name=${GITEA_AUTH_HEADER_NAME:Authorization}
agent.mcp.plane.auth-header-name=${PLANE_AUTH_HEADER_NAME:Authorization}
agent.mcp.mattermost.auth-header-value-format=${MATTERMOST_AUTH_HEADER_VALUE_FORMAT:Bearer %s}
agent.mcp.gitea.auth-header-value-format=${GITEA_AUTH_HEADER_VALUE_FORMAT:token %s}
agent.mcp.plane.auth-header-value-format=${PLANE_AUTH_HEADER_VALUE_FORMAT:Bearer %s}
agent.mcp.max-tool-result-characters=${AGENT_MCP_MAX_TOOL_RESULT_CHARACTERS:1000}
agent.mcp.plane.workspace-slug=${PLANE_WORKSPACE_SLUG:}
agent.identity.noah.mattermost.token=${NOAH_MATTERMOST_TOKEN:}
agent.identity.owen.mattermost.token=${OWEN_MATTERMOST_TOKEN:}
agent.identity.ethan.mattermost.token=${ETHAN_MATTERMOST_TOKEN:}
agent.identity.miles.mattermost.token=${MILES_MATTERMOST_TOKEN:}
agent.identity.noah.gitea.token=${NOAH_GITEA_TOKEN:}
agent.identity.owen.gitea.token=${OWEN_GITEA_TOKEN:}
agent.identity.ethan.gitea.token=${ETHAN_GITEA_TOKEN:}
agent.identity.miles.gitea.token=${MILES_GITEA_TOKEN:}
agent.identity.noah.plane.token=${NOAH_PLANE_TOKEN:}
agent.identity.owen.plane.token=${OWEN_PLANE_TOKEN:}
agent.identity.ethan.plane.token=${ETHAN_PLANE_TOKEN:}
agent.identity.miles.plane.token=${MILES_PLANE_TOKEN:}

camel.main.source-location-enabled=true
camel.main.name=llm-share-camel-kafka
camel.main.shutdown-timeout=1
camel.main.shutdown-now-on-timeout=true
camel.dataformat.jackson.auto-discover-object-mapper=true
